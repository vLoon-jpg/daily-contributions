name: Daily Contribution

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  make-contribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update contribution log
        run: |
          echo "- Auto-commit on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md

      - name: Commit and push changes
        run: |
          # Use the account's noreply address so commits always attribute to
          # vLoon-jpg regardless of the account's email-privacy setting.
          git config user.name "vLoon-jpg"
          git config user.email "251421586+vLoon-jpg@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit (README.md unchanged)."
            exit 0
          fi
          git commit -m "chore(daily): update activity log [$(date -u +'%Y-%m-%d')]"
          git push
